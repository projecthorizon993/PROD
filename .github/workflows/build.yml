name: Build (Android CameraX lean)

on:
  push:
    branches: [main, android-lean, ios-optimized]
  pull_request:
  workflow_dispatch:

jobs:
  js-bundle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: package-lock.json }
      - run: |
          npm ci
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output /tmp/android.bundle --assets-dest /tmp

  android:
    runs-on: ubuntu-latest
    needs: js-bundle-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: gradle }
      - name: Install JS deps
        run: npm ci
      - name: Build APK (CameraKit)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --warning-mode all
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Build AAB (Play Store)
        working-directory: android
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab
