name: Build (iOS ANE)

on:
  push:
    branches: [main, ios-optimized]
  pull_request:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build and export a signed IPA
        required: false
        default: false
        type: boolean

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-bundle-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx react-native bundle --platform ios --dev false --entry-file index.js --bundle-output /tmp/ios.bundle --assets-dest /tmp

  ios-compile:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer && xcodebuild -version || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer && xcodebuild -version
      - name: Cache iOS build products
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/DerivedData
            ${{ runner.temp }}/SourcePackages
            ios/Pods
          key: ios-derived-${{ hashFiles('ios/Podfile.lock', 'ios/CameraApp/NativeCamera/*.podspec', 'ios/CameraApp.xcodeproj/project.pbxproj', 'ios/**/*.swift') }}
          restore-keys: |
            ios-derived-
      - name: Install JS dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install pods
        working-directory: ios
        run: bundle exec pod install --no-repo-update
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/CameraApp.xcworkspace \
            -scheme CameraApp \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_PREVIEWS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/xcodebuild.log
      - name: Show build log
        if: failure()
        run: tail -n 600 /tmp/xcodebuild.log
      - name: Package unsigned IPA
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/CameraApp.app"
          test -d "$app"
          mkdir -p build/unsigned-ipa/Payload
          cp -R "$app" build/unsigned-ipa/Payload/
          xattr -cr build/unsigned-ipa/Payload/CameraApp.app 2>/dev/null || true
          cd build/unsigned-ipa
          zip -qr ../CameraApp-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CameraApp-unsigned-ipa
          path: build/CameraApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  ios-release:
    if: (github.event_name == 'workflow_dispatch' && inputs.signed_release) || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    timeout-minutes: 60
    needs: ios-compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer && xcodebuild -version || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer && xcodebuild -version
      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          cd ios
          bundle exec pod install --no-repo-update
      - name: Import signing certificates
        uses: apple-actions/import-codesigning-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}
      - name: Download provisioning profiles
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: com.camerapp
          issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      - name: Archive signed IPA
        run: |
          set -o pipefail
          xcodebuild -workspace ios/CameraApp.xcworkspace -scheme CameraApp -configuration Release -archivePath build/CameraApp.xcarchive archive CODE_SIGN_STYLE=manual 2>&1 | tee /tmp/archive.log
          xcodebuild -exportArchive -archivePath build/CameraApp.xcarchive -exportPath build/ipa -exportOptionsPlist ios/ExportOptions.plist 2>&1 | tee /tmp/export.log
      - name: Show signed build log
        if: failure()
        run: tail -n 300 /tmp/archive.log; tail -n 300 /tmp/export.log
      - uses: actions/upload-artifact@v4
        with:
          name: CameraApp-signed-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
      - name: Upload to TestFlight
        if: env.UPLOAD_TF == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: xcrun altool --upload-app -f build/ipa/CameraApp.ipa --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"
