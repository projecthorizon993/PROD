name: Build (iOS ANE + Android CameraX)

on:
  push:
    branches: [main, ios-optimized, android-lean]
  pull_request:
  workflow_dispatch:

jobs:
  js-bundle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: CameraApp/package-lock.json }
      - working-directory: CameraApp
        run: |
          npm ci
          npx react-native bundle --platform ios --dev false --entry-file index.js --bundle-output /tmp/ios.bundle --assets-dest /tmp
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output /tmp/android.bundle --assets-dest /tmp

  android:
    runs-on: ubuntu-latest
    needs: js-bundle-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: CameraApp/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: gradle }
      - name: Install JS deps
        working-directory: CameraApp
        run: npm ci
      - name: Build APK (CameraKit)
        working-directory: CameraApp/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --warning-mode all
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: CameraApp/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Build AAB (Play Store)
        working-directory: CameraApp/android
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: CameraApp/android/app/build/outputs/bundle/release/*.aab

  ios-compile:
    # No signing — just verifies that Swift + pods + ANE (16.0, ProCamera pod) compile on macOS.
    # Use ios-release job below for real device IPA.
    runs-on: macos-14
    needs: js-bundle-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: CameraApp/package-lock.json }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.2', bundler-cache: true, working-directory: CameraApp/ios }
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer && xcodebuild -version
      - name: Install JS deps
        working-directory: CameraApp
        run: npm ci
      - name: Pod install (ProCamera 16.0, ANE)
        working-directory: CameraApp/ios
        run: pod install --repo-update
      - name: Build for simulator (no signing)
        working-directory: CameraApp
        run: |
          xcodebuild -workspace ios/CameraApp.xcworkspace \
            -scheme CameraApp -configuration Release \
            -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            build CODE_SIGNING_ALLOWED=NO | xcpretty

  ios-release:
    # Real-device IPA — requires Apple secrets (see README). Runs only on manual dispatch or tag.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    needs: ios-compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: CameraApp/package-lock.json }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.2', bundler-cache: true, working-directory: CameraApp/ios }
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - name: Install deps + pods
        working-directory: CameraApp
        run: |
          npm ci
          cd ios && pod install --repo-update
      - name: Import signing certs
        uses: apple-actions/import-codesigning-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}
      - name: Download provisioning profiles
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: com.camerapp
          issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      - name: Archive IPA
        working-directory: CameraApp
        run: |
          xcodebuild -workspace ios/CameraApp.xcworkspace \
            -scheme CameraApp -configuration Release \
            -archivePath build/CameraApp.xcarchive archive \
            CODE_SIGN_STYLE=manual | xcpretty
          xcodebuild -exportArchive -archivePath build/CameraApp.xcarchive \
            -exportPath build/ipa -exportOptionsPlist ios/ExportOptions.plist | xcpretty
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: CameraApp/build/ipa/*.ipa
      - name: Upload to TestFlight (optional)
        if: env.UPLOAD_TF == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          xcrun altool --upload-app -f CameraApp/build/ipa/CameraApp.ipa --apiKey $APPLE_API_KEY_ID --apiIssuer $APPLE_API_ISSUER_ID
